# ARCHIVO DE EJEMPLO PARA secrets.toml
# 
# INSTRUCCIONES:
# 1. Copia el contenido de este archivo
# 2. Crea un archivo NUEVO llamado "secrets.toml" (sin "_example")
# 3. Pega el contenido y reemplaza TU_CONTRASEÑA y xxxxx
# 4. Guarda el archivo en la misma carpeta (.streamlit/)
#
# ⚠️ IMPORTANTE: 
# - El archivo "secrets.toml" (sin _example) nunca se sube a GitHub
# - Solo el "_example" se comparte
# - Streamlit Cloud tiene su propio secrets.toml en la interfaz web

DATABASE_URL = "postgresql://postgres:TU_CONTRASEÑA@db.xxxxx.supabase.co:5432/postgres"

# Requeridos para el acceso protegido de la app web.
# Configurá los valores reales en Streamlit Cloud Secrets o en variables de entorno;
# no agregues valores reales a este archivo ni al repositorio.
SUPABASE_URL = ""
SUPABASE_PUBLISHABLE_KEY = ""
SUPABASE_SECRET_KEY = ""
ADMIN_EMAIL = ""
APP_URL = ""
# SUPABASE_SECRET_KEY solo debe configurarse como secreto del servidor.
# APP_URL debe ser la URL completa de la app (sin query string) y agregarse,
# exactamente igual, a Supabase Auth → URL Configuration → Redirect URLs.
# En Auth → Email Templates → Invite User, el enlace debe llevar el token hash
# a la app, por ejemplo:
# <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=invite">Configurar contraseña</a>
# No uses {{ .ConfirmationURL }} para esta plantilla: el callback de Streamlit
# necesita recibir token_hash y type=invite como parámetros de consulta.
# Como alternativa temporal, se aceptan SUPABASE_ANON_KEY y
# SUPABASE_SERVICE_ROLE_KEY en lugar de las claves nuevas.
# El registro público también debe deshabilitarse en Supabase Auth.

# Configuración para enviar reportes PDF por correo.
# Gmail requiere una contraseña de aplicación, no la contraseña normal.
SMTP_HOST = "smtp.gmail.com"
SMTP_PORT = 465
SMTP_USER = "tu-cuenta@gmail.com"
SMTP_PASSWORD = "tu-contraseña-de-aplicacion"
REPORT_EMAIL_TO = "destinatario@ejemplo.com"

# Cómo obtener TU_CONTRASEÑA y xxxxx:
# 1. Ve a https://supabase.com y entra a tu proyecto
# 2. Settings → Database → Connection String → Python
# 3. Copia la URL, debe verse así:
#    postgresql://postgres:[TU_PASSWORD]@db.[PROJECT_ID].supabase.co:5432/postgres
